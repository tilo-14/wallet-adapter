name: Light Token Tests

on:
  push:
    branches:
      - master
    paths:
      - 'packages/core/react-light/**'
      - 'packages/starter/light-token-starter/**'
      - '.github/workflows/light-token-test.yml'
      - '.github/actions/setup-environment/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/core/react-light/**'
      - 'packages/starter/light-token-starter/**'
      - '.github/workflows/light-token-test.yml'
      - '.github/actions/setup-environment/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_CLI_VERSION: "2.1.21"
  NODE_VERSION: "22"
  PHOTON_VERSION: "ac7df6c388db847b7693a7a1cb766a7c9d7809b5"
  # Turbo remote caching
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  light-token-tests:
    name: Light Token TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.1
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-light-${{ hashFiles('packages/core/react-light/package.json', 'packages/starter/light-token-starter/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-light-
            ${{ runner.os }}-pnpm-store-

      - name: Cache Solana CLI tools
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana/
            ~/.local/share/solana/
          key: solana-cli-${{ runner.os }}-${{ env.SOLANA_CLI_VERSION }}

      - name: Install Solana CLI tools
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_CLI_VERSION }}/install)"

      - name: Add Solana to PATH
        run: echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Light CLI
        id: cache-light-cli
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: light-cli-${{ runner.os }}-beta

      - name: Install Light CLI
        run: npm install -g @lightprotocol/zk-compression-cli@beta

      - name: Cache Rust and Photon
        id: cache-photon
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/photon
            ~/.cargo/registry/
            ~/.cargo/git/
          key: photon-${{ runner.os }}-${{ env.PHOTON_VERSION }}
          restore-keys: |
            photon-${{ runner.os }}-

      - name: Install Rust (for Photon)
        if: steps.cache-photon.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Install Photon indexer
        if: steps.cache-photon.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/lightprotocol/photon.git --rev ${{ env.PHOTON_VERSION }} --locked
        env:
          RUSTFLAGS: "-A dead-code"

      - name: Generate keypair
        run: solana-keygen new --no-bip39-passphrase

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build all packages (turbo will cache unchanged ones)
      - name: Build packages
        run: pnpm run build

      - name: Start test validator
        run: |
          light test-validator &
          # Wait for validator to be ready
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:8784/health > /dev/null 2>&1; then
              echo "Validator is ready!"
              break
            fi
            echo "Waiting for validator... ($i/60)"
            sleep 2
          done

      - name: TypeScript type check for react-light
        working-directory: packages/core/react-light
        run: pnpm exec tsc --noEmit
